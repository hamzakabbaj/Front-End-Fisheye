<!DOCTYPE html>
<html>
  <head>
    <link href="css/style.css" rel="stylesheet" type="text/css" />
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link
      href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <title>Fisheye - photographe</title>
  </head>
  <body>
    <header>
      <a href="index.html">
        <img
          src="assets/images/logo.png"
          class="logo"
          alt="Fisheye Home page"
        />
      </a>
    </header>
    <main id="main">
      <div class="photograph-header">
        <div class="photograph-contact-button-container">
          <button
            class="contact_button"
            onclick="displayModal()"
            aria-label="Contactez-moi"
          >
            Contactez-moi
          </button>
        </div>
      </div>
      <div class="sort-by">
        <h3>Trier par</h3>
        <select name="sort" id="sort" aria-label="Trier par">
          <option value="likes">Popularité</option>
          <option value="date">Date</option>
          <option value="title">Titre</option>
        </select>
      </div>
      <div class="photograph-media"></div>
    </main>
    <div id="contact_modal">
      <div class="modal">
        <header>
          <h2>Contactez-moi</h2>
          <img src="assets/icons/close.svg" onclick="closeModal()" />
        </header>

        <form id="contact-form">
          <h2 id="modal-photographer-name"></h2>
          <div>
            <label for="firstname">Prénom</label>
            <input type="text" id="firstname" />
            <label for="lastname">Nom</label>
            <input type="text" id="lastname" />
            <label for="email">Email</label>
            <input type="email" id="email" />
            <label for="message">Votre message</label>
            <textarea id="message"></textarea>
          </div>
          <div id="contact-form-error"></div>
          <button class="contact_button">Envoyer</button>
        </form>
      </div>
    </div>
    <div id="lightbox-modal" aria-label="image closeup view">
      <div class="lightbox-modal-content">
        <button class="lightbox-modal-previous" aria-label="previous image">
          <i class="fas fa-chevron-left"></i>
        </button>
        <div class="lightbox-modal-image">
          <p class="lightbox-modal-image-title"></p>
        </div>
        <button class="lightbox-modal-next" aria-label="next image">
          <i class="fas fa-chevron-right"></i>
        </button>
        <button
          class="lightbox-modal-close"
          onclick="closeLightboxModal()"
          aria-label="close dialog"
        >
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    <script src="scripts/pages/photographer.js"></script>
    <script src="scripts/utils/contactForm.js"></script>
    <script src="scripts/utils/lightbox.js"></script>
  </body>
</html>
