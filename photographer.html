<!DOCTYPE html>
<html lang="fr">
  <head>
    <link href="css/style.css" rel="stylesheet" type="text/css" />
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link
      href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <title>Fisheye - photographe</title>
  </head>
  <body>
    <header>
      <a href="index.html">
        <img
          src="assets/images/logo.png"
          class="logo"
          alt="Retour à la page d'accueil Fisheye"
        />
      </a>
    </header>
    <main id="main">
      <div class="photograph-header">
        <div class="photograph-contact-button-container">
          <button
            class="contact_button"
            onclick="displayModal()"
            aria-label="Contactez le photographe"
          >
            Contactez-moi
          </button>
        </div>
      </div>
      <div class="sort-by">
        <span id="sort-description" class="sr-only" tabindex="0"
          >Choisissez comment trier les médias du photographe</span
        >
        <label for="sort" id="sort-label">Trier par</label>
        <select name="sort" id="sort" aria-label="Options de tri des médias">
          <option
            value="likes"
            aria-label="Tri par nombre de likes, du plus populaire au moins populaire"
          >
            Popularité
          </option>
          <option
            value="date"
            aria-label="Tri par date, du plus récent au plus ancien"
          >
            Date
          </option>
          <option
            value="title"
            aria-label="Tri par ordre alphabétique du titre"
          >
            Titre
          </option>
        </select>
      </div>
      <div class="photograph-media"></div>
    </main>
    <div
      id="contact_modal"
      aria-modal="true"
      role="dialog"
      aria-label="Contactez-moi"
    >
      <div class="modal" role="dialog" aria-label="Contactez-moi">
        <header>
          <h2>Contactez-moi</h2>
          <img
            src="assets/icons/close.svg"
            onclick="closeModal()"
            alt="Fermer le formulaire de contact"
          />
        </header>

        <form id="contact-form">
          <h2 id="modal-photographer-name"></h2>
          <div>
            <label for="firstname">Prénom</label>
            <input type="text" id="firstname" required />
            <label for="lastname">Nom</label>
            <input type="text" id="lastname" required />
            <label for="email">Email</label>
            <input type="email" id="email" required />
            <label for="message">Votre message</label>
            <textarea id="message" required></textarea>
          </div>
          <div id="contact-form-error"></div>
          <button class="contact_button">Envoyer</button>
        </form>
      </div>
    </div>
    <div id="lightbox-modal" aria-label="Vue agrandie de l'image">
      <div class="lightbox-modal-content">
        <button class="lightbox-modal-previous" aria-label="Image précédente">
          <span class="fas fa-chevron-left"></span>
        </button>
        <div class="lightbox-modal-image">
          <p class="lightbox-modal-image-title"></p>
        </div>
        <button class="lightbox-modal-next" aria-label="Image suivante">
          <span class="fas fa-chevron-right"></span>
        </button>
        <button
          class="lightbox-modal-close"
          onclick="closeLightboxModal()"
          aria-label="Fermer la fenêtre lightbox"
        >
          <span class="fas fa-times"></span>
        </button>
      </div>
    </div>
    <script src="scripts/factories/mediaFactory.js"></script>
    <script src="scripts/pages/photographer.js"></script>
    <script src="scripts/utils/contactForm.js"></script>
    <script src="scripts/utils/lightbox.js"></script>
  </body>
</html>
